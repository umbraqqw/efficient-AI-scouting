<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting network</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    
<!-- Floating top bar -->

<!-- Divide the page into two columns, display player card on the right and player list on the left -->

<div class="wrapper">
  <div id="sidebar">
    <input type="text" id="player-search">
    <ul>
     <!--
      <li>
        <input type="radio" name="player-select" id="p1" class="player-radio" checked>
        <label for="p1" class="player-item">Erling Haaland</label>
      </li>
      <li>
        <input type="radio" name="player-select" id="p2" class="player-radio">
        <label for="p2" class="player-item">Martin Ødegaard</label>
      </li>
     
     --> 

    </ul>

  </div>



  <div id="playerView">
    <div class="card">
        <div class="photo-area">
          <div class="photo-placeholder">
            <img src="https://t3.ftcdn.net/jpg/00/88/78/20/360_F_88782064_x9Ow2lKie1fr4ncBYLE88x6InooDKAq7.jpg" alt="Player photo">
          </div>
        </div>
    
        <div class="name-plate">
          <h1 class="player-name" id="player-name">Player Name</h1>
          <p class="player-role">Position: Left Wing &middot; Club: IK Start</p>
        </div>
    
        <div class="stats">
          <div class="stat">
            <div class="stat-value"><span id="avg-speed">--</span><span class="stat-unit">km/h</span></div>
            <div class="stat-label">Avg. Top Speed</div>
          </div>
          <div class="stat">
            <div class="stat-value"><span id="avg-cross">--</span><span class="stat-unit">%</span></div>
            <div class="stat-label">Avg. Cross Success</div>
          </div>
          <div class="stat">
            <div class="stat-value"><span id="avg-shot">--</span><span class="stat-unit">%</span></div>
            <div class="stat-label">Avg. Shot Accuracy</div>
          </div>
        </div>
      </div>
  </div>

</div>










    <script src="script.js"></script>
</body>
</html>
